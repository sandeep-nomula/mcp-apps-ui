<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX RFQ Dev Host</title>
    <style>
      :root {
        --bg: #faf9f5; --panel: #ffffff; --fg: #1f1e1d; --fg-2: #6b6a64; --border: #e5e3dc;
        --user: #f0eee6; --accent: #c96442; --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --bg: #262624; --panel: #1f1f1e; --fg: #f2f1ed; --fg-2: #a6a39b; --border: #3d3d3a; --user: #30302e; }
      }
      :root[data-theme="dark"] { --bg: #262624; --panel: #1f1f1e; --fg: #f2f1ed; --fg-2: #a6a39b; --border: #3d3d3a; --user: #30302e; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--fg-2); }
      header strong { color: var(--fg); }
      #chat { max-width: 820px; margin: 0 auto; padding: 16px 16px 180px; display: flex; flex-direction: column; gap: 14px; }
      .msg.user { align-self: flex-end; background: var(--user); padding: 8px 14px; border-radius: 16px; max-width: 80%; }
      .msg.assistant { align-self: stretch; }
      .msg.system { align-self: center; font-size: 12px; color: var(--fg-2); background: var(--user); padding: 4px 10px; border-radius: 999px; }
      .tool { font-size: 12px; color: var(--fg-2); font-family: var(--mono); margin-bottom: 6px; }
      iframe { width: 100%; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); display: block; height: 320px; }
      form { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 24px 16px 16px; }
      .composer { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .composer label { font-size: 12px; color: var(--fg-2); display: flex; flex-direction: column; gap: 2px; }
      .composer input, .composer select { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
      .composer input[name="amount"] { width: 130px; }
      .composer input[name="pair"] { width: 90px; text-transform: uppercase; }
      .banks { display: flex; gap: 8px; font-size: 13px; color: var(--fg); align-items: center; }
      .spacer { flex: 1; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; }
      button.secondary { background: var(--user); color: var(--fg); }
      .theme { background: none; color: var(--fg-2); padding: 4px 8px; border: 1px solid var(--border); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span><strong>Dev host</strong> — renders the MCP App like Claude does (sandboxed iframe + AppBridge)</span>
      <span><span id="conn">connecting…</span> <button class="theme" id="theme" type="button">Toggle theme</button></span>
    </header>
    <main id="chat"></main>
    <form id="composer">
      <div class="composer">
        <label>Side<select name="side"><option>BUY</option><option>SELL</option></select></label>
        <label>Amount<input name="amount" type="number" value="1000000" min="1" step="any" /></label>
        <label>Pair<input name="pair" value="USD/GBP" /></label>
        <label>Dealt ccy<input name="dealt" placeholder="base" style="width: 70px" /></label>
        <div class="banks">
          <label style="flex-direction: row; gap: 4px"><input type="checkbox" name="bank" value="bank1" checked />bank1</label>
          <label style="flex-direction: row; gap: 4px"><input type="checkbox" name="bank" value="bank2" checked />bank2</label>
          <label style="flex-direction: row; gap: 4px"><input type="checkbox" name="bank" value="bank3" checked />bank3</label>
        </div>
        <span class="spacer"></span>
        <button type="button" class="secondary" id="trades">Show trades</button>
        <button type="submit" class="primary">Request prices</button>
      </div>
    </form>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
